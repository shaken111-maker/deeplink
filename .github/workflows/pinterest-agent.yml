name: Pinterest agent

on:
  schedule:
    # 09:00, 15:00 и 20:00 UTC каждый день
    - cron: "0 9,15,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Только показать план, ничего не публиковать"
        type: boolean
        default: false

concurrency:
  group: pinterest-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r pinterest-agent/requirements.txt

      - name: Публикация пинов
        working-directory: pinterest-agent
        env:
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPLINK_BASE: ${{ vars.DEEPLINK_BASE }}
          POSTS_PER_RUN: ${{ vars.POSTS_PER_RUN }}
          CONTENT_LANGUAGE: ${{ vars.CONTENT_LANGUAGE }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python agent.py

      - name: Сохранить историю публикаций
        if: always()
        run: |
          if [ -n "$(git status --porcelain pinterest-agent/state)" ]; then
            git config user.name "pinterest-agent"
            git config user.email "actions@github.com"
            git add pinterest-agent/state
            git commit -m "chore(pinterest-agent): update posted state"
            git push
          fi
